spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:edupulse}
    username: ${POSTGRES_USER:edupulse}
    password: ${POSTGRES_PASSWORD:edupulse}
  jpa:
    properties:
      hibernate:
        '[default_schema]': ${POSTGRES_SCHEMA:auth}
    hibernate:
      ddl-auto: none
  flyway:
    schemas: ${POSTGRES_SCHEMA:auth}
    default-schema: ${POSTGRES_SCHEMA:auth}
    create-schemas: true
    locations: classpath:db/migrations

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
