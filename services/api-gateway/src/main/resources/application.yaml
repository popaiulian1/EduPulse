spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
            - id: ingestion-service
              uri: lb://ingestion-service
              predicates:
                - Path=/api/ingestion/**
              filters:
                - StripPrefix=2

jwt:
  issuer: https://auth.api.edupulse

# API docs: off by default, the dev launch configurations switch them on.
# The gateway's Swagger UI lists the docs of the services behind it.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: ingestion-service
        url: /api/ingestion/v3/api-docs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
